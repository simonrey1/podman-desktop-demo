services:
  db:
    image: registry.access.redhat.com/hi/postgresql:18.4
    environment:
      POSTGRES_USER: grocery
      POSTGRES_PASSWORD: grocery
      POSTGRES_DB: grocery
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery -d grocery"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - grocery-db:/var/lib/postgresql/data

  api:
    image: api:1.0.0
    build: ./api
    environment:
      DATABASE_URL: postgresql://grocery:grocery@db:5432/grocery
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'

  web:
    image: web:1.0.0
    build: ./web
    depends_on:
      - api
    ports:
      - '127.0.0.1:8080:8080'

volumes:
  grocery-db: {}
